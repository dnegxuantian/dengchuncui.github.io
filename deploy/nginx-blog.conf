server {
    listen 80;
    listen [::]:80;
    server_name blog.chuncui.icu;

    root /var/www/blog.chuncui.icu/current;
    index index.html;

    access_log /var/log/nginx/blog.chuncui.icu.access.log;
    error_log /var/log/nginx/blog.chuncui.icu.error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|gif|png|jpe?g|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ /\. {
        deny all;
    }
}
