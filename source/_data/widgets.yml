blogger:
  class: blogger
  display: [desktop, mobile]
  avatar: /images/avatar.jpg
  shape: rectangle
  url: /about/
  title: DENG MINGRUI / 邓明瑞
  subtitle: DATA SYSTEMS · AGENT ENGINEERING
  jinrishici: false
  social:
    - icon: fab fa-github
      url: https://github.com/dnegxuantian
    - icon: fa-solid fa-envelope
      url: mailto:duncan_dengmr@163.com
    - icon: fa-solid fa-rss
      url: /atom.xml

toc:
  class: toc
  display: [desktop, mobile]
  sticky: true
  header:
    icon: fa-solid fa-list
    title: 本文目录
  list_number: false
  min_depth: 2
  max_depth: 5

category:
  class: category
  display: [desktop]
  header:
    icon: fa-solid fa-folder-open
    title: 文章分类
    url: /categories/

tagcloud:
  class: tagcloud
  display: [desktop]
  header:
    icon: fa-solid fa-tags
    title: 热门标签
    url: /tags/
  min_font: 14
  max_font: 22
  color: false
  start_color: '#7a8497'
  end_color: '#3768d4'

recent:
  class: recent
  display: [desktop, mobile]
  header:
    icon: fa-solid fa-clock
    title: 最近更新
  limit: 6

webinfo:
  class: webinfo
  display: [desktop]
  header:
    icon: fa-solid fa-chart-simple
    title: 站点信息
  type:
    article:
      enable: true
      text: 文章数目：
      unit: 篇
    runtime:
      enable: true
      data: '2020/03/04'
      text: 已持续记录：
      unit: 天
    wordcount:
      enable: true
      text: 本站总字数：
      unit: 字
    visitcounter:
      enable: false
    lastupd:
      enable: true
      friendlyShow: true
      text: 最后活动：
      unit: 日
