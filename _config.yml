title: 邓明瑞 / 纯粹
subtitle: 数据中台 × AI Agent
description: 邓明瑞（Chuncui / 纯粹）的技术站点，记录数据中台、数据湖、分布式系统与 AI Agent 工程化实践。
keywords:
