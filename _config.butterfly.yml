nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  主页: / || fas fa-house
  归档: /archives/ || fas fa-box-archive
  分类: /categories/ || fas fa-layer-group
  标签: /tags/ || fas fa-hashtag
  关于: /about/ || fas fa-user-astronaut

code_blocks:
  theme: light
  macStyle: false
  height_limit: 720
  word_wrap: false
  copy: true
  language: true
  shrink: false

social:
  fab fa-github: https://github.com/dengchuncui || GitHub || '#24292f'
  fas fa-envelope: mailto:duncan_dengmr@163.com || Email || '#b95832'

favicon: /images/favicon.svg
avatar:
  img: /images/avatar.svg
  effect: false

disable_top_img: false
default_top_img: /images/hero.svg
index_img: /images/hero.svg
archive_img: /images/hero-archive.svg
tag_img: /images/hero-archive.svg
category_img: /images/hero-archive.svg
footer_img: false
background: '#f2efe8'

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /images/covers/default.svg

error_img:
  flink: /images/avatar.svg
  post_page: /images/legacy-missing.svg

error_404:
  enable: true
  subtitle: 这里暂时没有内容
  background: /images/hero-archive.svg

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: false
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: false

index_site_info_top: 42%
index_top_img_height: 78vh
subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 关于代码、数据与系统的长期笔记
index_layout: 3
index_post_content:
  method: 2
  length: 220

toc:
  post: true
  page: false
  number: false
  expand: false
style_simple: false
scroll_percent: true
post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/dengchuncui
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
reward:
  enable: false
post_edit:
  enable: true
  url: https://github.com/dengchuncui/dengchuncui.github.io/edit/main/source/
related_post:
  enable: true
  limit: 4
  date_type: created
post_pagination: 1
noticeOutdate:
  enable: true
  style: flat
  limit_day: 730
  position: top
  message_prev: 这篇文章已有
  message_next: 天未更新，部分版本与实践可能已经变化。

footer:
  owner:
    enable: true
    since: 2020
  copyright:
    enable: true
    version: false
  custom_text: 代码会过时，判断力不会。

aside:
  enable: true
  hide: false
  button: true
  mobile: false
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: Java · 数据系统 · 工程实践
    button:
      enable: true
      icon: fab fa-github
      text: 查看 GitHub
      link: https://github.com/dengchuncui
  card_announcement:
    enable: true
    content: 这里保存长期有效的技术判断，也保留走过的弯路。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 24
    color: false
    orderby: name
    order: 1
  card_archives:
    enable: true
    type: yearly
    format: YYYY
    order: -1
    limit: 8
  card_post_series:
    enable: false
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

readmode: true
darkmode:
  enable: true
  button: true
  autoChangeMode: 1
rightside_scroll_percent: true
rightside_config_animation: false

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 220
wordcount:
  enable: false
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

search:
  use: local_search
  placeholder: 搜索文章、技术与关键词
local_search:
  preload: true
  top_n_per_article: 2
  unescape: true
  pagination:
    enable: true
    hitsPerPage: 8

share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq
comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

theme_color:
  enable: true
  main: '#b95832'
  paginator: '#b95832'
  button_hover: '#923f25'
  text_selection: '#d9a58d'
  link_color: '#65716d'
  meta_color: '#7b7770'
  hr_color: '#d2cbc0'
  code_foreground: '#9a4529'
  code_background: 'rgba(185, 88, 50, .08)'
  toc_color: '#b95832'
  blockquote_padding_color: '#b95832'
  blockquote_background_color: '#eee7dc'
  scrollbar_color: '#b95832'
  meta_theme_color_light: '#f2efe8'
  meta_theme_color_dark: '#171c1d'

category_ui: index
tag_ui: index
rounded_corners_ui: true
text_align_justify: false
mask:
  header: true
  footer: false
preloader:
  enable: false
enter_transitions: true
display_mode: light
beautify:
  enable: false
font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif'
  code_font_family: '"SFMono-Regular", "JetBrains Mono", Consolas, monospace'
blog_title_font:
  font_link:
  font_family: '"Noto Serif SC", "Songti SC", Georgia, serif'

lightbox: medium_zoom
pjax:
  enable: true
  exclude:
snackbar:
  enable: true
  position: bottom-center
  bg_light: '#1f292b'
  bg_dark: '#b95832'
instantpage: true
lazyload:
  enable: true
  native: true
  field: site
  placeholder:
  blur: false
Open_Graph_meta:
  enable: true
structured_data:
  enable: true
  alternate_name:
    - 纯粹博客
    - 邓纯粹的博客

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/custom.js" defer></script>

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
